<!DOCTYPE html>
<!-- login.html — Panther Cloud Air Operations Portal entry point.
     ─────────────────────────────────────────────────────────────
     AUTHENTICATION FLOW
     ───────────────────
     1. User enters username + password and clicks "Sign In" (or presses Enter).
     2. submitLogin() POSTs { username, password } to the Flask /api/login endpoint.
     3. Flask checks the credentials against the bcrypt-hashed password in the Users
        table and returns:
          { "ok": true,  "username": "...", "user_type": "Admin"|"Employee" }
        or
          { "ok": false, "error": "Invalid credentials." }
     4. On success: _saveSessionAndRedirect() (shared.js) saves username + role to
        sessionStorage, then redirects:
          Admin    →  admin.html   (full access: admin tabs + employee tabs)
          Employee →  employee.html (flight search + live status only)
     5. On API failure (DB offline / network error): an error message is shown.
        There is NO demo bypass — credentials are always required.

     ROLE ENFORCEMENT
     ────────────────
     - admin.html:    init() redirects non-Admin users to employee.html immediately.
     - employee.html: all users with a valid session may access it.
     - Other pages (airports, schedule, book, coverage): accessible to any
       authenticated user; checkAuth() in shared.js redirects to login.html
       if no session is found.

     ALREADY-LOGGED-IN SHORT-CIRCUIT
     ────────────────────────────────
     The inline init() at the bottom checks sessionStorage on every page load.
     If a valid session already exists, the user is redirected to their portal
     instantly, skipping the login form entirely. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Panther Cloud Air — Sign In</title>
  <!-- Orbitron: display / branding font (logo, headings)
       DM Sans:  body text — clean, neutral, readable at small sizes -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link href="panther_cloud_air.css" rel="stylesheet">
</head>
<body>

<!-- ── Light / Dark theme toggle ────────────────────────────────────
     Fixed to top-right so it is always reachable.
     The checkbox's onchange calls setTheme() from shared.js, which toggles
     the "light" class on <body> and persists the choice in localStorage so the
     preference survives page reloads and navigation to other pages. -->
<div style="position:fixed;top:12px;right:14px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);z-index:10">
  <span>Light</span>
  <label class="theme-sw">
    <input type="checkbox" id="theme-chk" onchange="setTheme(this.checked)">
    <span class="theme-sw-slider"></span>
  </label>
</div>

<!-- ── Login card ───────────────────────────────────────────────────
     Centered vertically and horizontally via flexbox.
     .lbox / .lcard are defined in panther_cloud_air.css. -->
<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <div class="lbox">

    <!-- Branding header: airplane emoji + airline name + course identifier -->
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:32px">&#x2708;</div>
      <div style="font-family:'Orbitron',monospace;font-size:14px;color:var(--lav);margin:6px 0 2px">PANTHER CLOUD AIR</div>
      <div style="font-size:11px;color:var(--dim)">Operations Portal &mdash; CSC4710 Spring 2026</div>
    </div>

    <!-- Login form
         #lu  — username text field
         #lp  — password field (type=password masks input)
         keydown listener on the card handles Enter → submitLogin() so the user
         does not have to reach for the mouse to submit. -->
    <div class="lcard" onkeydown="if(event.key==='Enter') submitLogin()">
      <div class="f">
        <label>Username</label>
        <input id="lu" placeholder="username" autocomplete="username">
      </div>
      <div class="f">
        <label>Password</label>
        <input id="lp" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password">
      </div>

      <!-- Sign In button — calls submitLogin() on click -->
      <button class="btn bp" style="width:100%;justify-content:center;margin-top:4px" onclick="submitLogin()">Sign In</button>

      <!-- #login-err: shown only when credentials fail or the server returns an error.
           Hidden by default via display:none; text is set programmatically in submitLogin(). -->
      <p id="login-err" style="font-size:11px;color:var(--bad);text-align:center;margin-top:8px;display:none"></p>
    </div>

  </div>
</div>

<!-- aircraft_schedule.js: defines API_BASE and static constants (AIRPORTS, FLIGHTS, etc.)
     panther_cloud_air_shared.js: shared helpers — applyTheme, _saveSessionAndRedirect, checkAuth, etc. -->
<script src="aircraft_schedule.js"></script>
<script src="panther_cloud_air_shared.js"></script>
<script>
'use strict';

/* submitLogin()
   ─────────────
   Reads the username and password fields, validates they are non-empty,
   then POSTs to the Flask /api/login endpoint.

   Success path (HTTP 200 + data.ok === true):
     _saveSessionAndRedirect(username, user_type) stores credentials in sessionStorage
     and redirects: Admin → admin.html, Employee → employee.html.

   Failure path (HTTP 401 + data.ok === false):
     The error message returned by the API (e.g. "Invalid credentials.") is
     displayed in #login-err.

   Network / DB offline path (fetch throws):
     An "Unable to reach the server" message is shown. There is intentionally
     no demo bypass — the database must be running to log in.
     If you need to demo without a DB, run the Docker stack: `docker compose up`. */
function submitLogin() {
  var u = document.getElementById('lu').value.trim();
  var p = document.getElementById('lp').value.trim();
  var errEl = document.getElementById('login-err');

  // Client-side: require both fields before hitting the network
  if (!u || !p) {
    errEl.textContent = 'Username and password are required.';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  fetch(API_BASE + '/api/login', {
    method:  'POST',
    headers: {'Content-Type': 'application/json'},
    body:    JSON.stringify({username: u, password: p})
  })
  .then(function(res){ return res.json(); })
  .then(function(data){
    if (data.ok) {
      // API confirmed valid credentials — data.user_type is "Admin" or "Employee"
      _saveSessionAndRedirect(data.username, data.user_type);
    } else {
      // Invalid credentials — show the server's error message
      errEl.textContent = data.error || 'Invalid credentials.';
      errEl.style.display = 'block';
    }
  })
  .catch(function(){
    // Network error or DB is offline — no demo fallback; require proper login
    errEl.textContent = 'Unable to reach the server. Make sure the application is running (docker compose up).';
    errEl.style.display = 'block';
  });
}

/* Immediately-invoked init
   ─────────────────────────
   Runs the moment the page loads.
   1. Applies the stored light/dark theme preference via applyTheme().
   2. Checks sessionStorage for an active session; if one exists the user is
      redirected to their portal immediately — they never see the login form. */
(function init() {
  applyTheme();
  var user = sessionStorage.getItem('pca_username');
  var role = sessionStorage.getItem('pca_role');
  if (user) {
    // Already authenticated — go straight to the appropriate portal
    window.location.href = (role === 'Admin') ? 'admin.html' : 'employee.html';
  }
})();
</script>
</body>
</html>
